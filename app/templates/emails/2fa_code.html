<!DOCTYPE html>
<html lang="pt-BR">
<body style="font-family:Arial,sans-serif;background:#f9fafb;padding:32px;">
  <div style="max-width:480px;margin:0 auto;background:#fff;border-radius:8px;padding:32px;border:1px solid #e5e7eb;">
    <h2 style="color:#1d4ed8;margin-top:0;">{{ app_name }}</h2>
    <p>Olá, <strong>{{ user.name }}</strong>!</p>
    <p>Seu código de verificação para acesso ao portal é:</p>
    <div style="text-align:center;margin:24px 0;">
      <span style="font-size:36px;font-weight:bold;letter-spacing:12px;color:#1d4ed8;">
        {{ code }}
      </span>
    </div>
    <p style="color:#6b7280;font-size:14px;">
      Este código expira em <strong>10 minutos</strong>.<br>
      Se você não solicitou este código, ignore este e-mail.
    </p>
    <hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0;" />
    <p style="color:#9ca3af;font-size:12px;text-align:center;">{{ app_name }} &mdash; acesso seguro</p>
  </div>
</body>
</html>
