{% extends "layouts/app.html" %}
{% block title %}Adicionar fotos — {{ gallery.title }}{% endblock %}
{% block content %}
<div class="max-w-2xl"
     x-data="{
       previews: [],
       handleFiles(e) {
         this.previews = [];
         const files = Array.from(e.target.files);
         files.forEach(f => {
           const reader = new FileReader();
           reader.onload = ev => this.previews.push(ev.target.result);
           reader.readAsDataURL(f);
         });
       }
     }">

  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('gallery.detail', gallery_id=gallery.id) }}"
       class="text-gray-400 hover:text-gray-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
      </svg>
    </a>
    <h1 class="text-2xl font-bold text-gray-900">Adicionar fotos</h1>
    <span class="text-gray-400 text-sm">{{ gallery.title }}</span>
  </div>

  <form method="POST" enctype="multipart/form-data" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    {# zona de drop #}
    <label for="file-input"
           class="flex flex-col items-center justify-center w-full h-44 rounded-xl
                  border-2 border-dashed border-gray-300 cursor-pointer
                  hover:border-primary-400 hover:bg-primary-50 transition bg-white">
      <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor"
           stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12
                 3m0 0 4.5 4.5M12 3v13.5"/>
      </svg>
      <p class="text-sm text-gray-500">Clique ou arraste as imagens aqui</p>
      <p class="text-xs text-gray-400 mt-1">JPG, PNG, WEBP, GIF</p>
      <input id="file-input" type="file" name="images" accept="image/*"
             multiple class="hidden"
             @change="handleFiles($event)">
    </label>

    {# pré-visualização #}
    <div x-show="previews.length > 0" class="mt-4">
      <p class="text-sm text-gray-600 mb-2" x-text="previews.length + ' foto(s) selecionada(s)'"></p>
      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
        <template x-for="(src, i) in previews" :key="i">
          <img :src="src" class="w-full h-16 object-cover rounded-lg border border-gray-200">
        </template>
      </div>
    </div>

    <div class="mt-5 flex justify-end gap-3">
      <a href="{{ url_for('gallery.detail', gallery_id=gallery.id) }}"
         class="px-4 py-2 text-sm rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">
        Cancelar
      </a>
      <button type="submit"
              class="px-5 py-2 text-sm rounded-md bg-primary-600 text-white hover:bg-primary-700">
        Enviar fotos
      </button>
    </div>
  </form>
</div>
{% endblock %}
