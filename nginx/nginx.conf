upstream flask_app {
    server app:5000;
    keepalive 16;
}

upstream treinamento_app {
    server treinamento_adtsa_web:5000;
    keepalive 8;
}

# HTTP: servir desafio ACME e redirecionar tudo para HTTPS
server {
    listen 80;
    server_name intranet.pedragon.com.br;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: proxy reverso + segurança
server {
    listen 443 ssl;
    server_name intranet.pedragon.com.br;
    server_tokens off;

    # Resolve novamente o hostname 'app' a cada 10s (evita IP stale após rebuild)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Certificados Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/intranet.pedragon.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intranet.pedragon.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Tamanho máximo de upload (deve coincidir com MAX_CONTENT_LENGTH)
    client_max_body_size 16M;

    # Headers de segurança HTTP
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net use.typekit.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com use.typekit.net p.typekit.net; img-src 'self' data: blob:; font-src 'self' data: fonts.gstatic.com use.typekit.net; object-src 'none'; frame-src app.powerbi.com 'self'; frame-ancestors 'self';" always;

    # Redireciona /treinamento → /treinamento/ (trailing slash obrigatório)
    location = /treinamento {
        return 301 /treinamento/;
    }

    # Proxy reverso para o app Treinamento Pedragon
    location /treinamento/ {
        proxy_pass         http://treinamento_app/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Script-Name     /treinamento;
        proxy_redirect     off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        client_max_body_size 100M;
    }

    # Uploads servidos diretamente pelo Nginx
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Tudo mais vai para o Flask via Gunicorn
    location / {
        proxy_pass         http://flask_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }
}
