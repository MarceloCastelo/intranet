services:

  # ----------------------------------------------------------
  # MySQL 8.0
  # ----------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: portal_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    # porta 3306 NÃO exposta externamente — acesso apenas pela rede interna Docker
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portal_net

  # ----------------------------------------------------------
  # Redis (cache de aplicação)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: portal_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - portal_net

  # ----------------------------------------------------------
  # Flask + Gunicorn
  # ----------------------------------------------------------
  app:
    build: .
    container_name: portal_app
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portal_net

  # ----------------------------------------------------------
  # Nginx (proxy reverso + arquivos estáticos)
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: portal_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - app
    networks:
      - portal_net

# ----------------------------------------------------------
# Volumes & Networks
# ----------------------------------------------------------
volumes:
  mysql_data:

networks:
  portal_net:
    driver: bridge
